[package]
name = "hlbina"
version = "1.0.0"
description = "HLBINA: a 2.5D dig, sell and upgrade game."
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# The game is the web build; the shell only opens a window, so build it small.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
